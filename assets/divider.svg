  </circle>
  <circle cy="20" r="4" fill="#67e8f9">
    <animate attributeName="cx" values="880;20;880" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
