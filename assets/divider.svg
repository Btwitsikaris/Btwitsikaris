<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" role="img" aria-label="Divider with two dots crossing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <line x1="20" y1="20" x2="880" y2="20" stroke="#ec4899" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>

  <circle cy="20" r="9" fill="#ec4899" fill-opacity="0.25">
    <animate attributeName="cx" values="20;880;20" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <circle cy="20" r="4" fill="#f472b6">
    <animate attributeName="cx" values="20;880;20" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>

  <circle cy="20" r="9" fill="#22d3ee" fill-opacity="0.25">
